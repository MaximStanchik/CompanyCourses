version: '3.8'

services:
  # База данных PostgreSQL
  postgres:
    image: postgres:15
    container_name: company_courses_postgres
    environment:
      POSTGRES_DB: ItCourses
      POSTGRES_USER: admin12345
      POSTGRES_PASSWORD: admin12345
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin12345 -d ItCourses"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO для хранения файлов
  minio:
    image: minio/minio:latest
    container_name: company_courses_minio
    environment:
      MINIO_ROOT_USER: Maxim
      MINIO_ROOT_PASSWORD: 1337R1337R
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "9075:9000"
      - "9001:9001"
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Backend Node.js приложение
  backend:
    build: ./backend
    container_name: company_courses_backend
    environment:
      DATABASE_URL: postgresql://admin12345:admin12345@postgres:5432/ItCourses
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: admin12345
      DB_PASSWORD: admin12345
      DB_NAME: ItCourses
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: Maxim
      MINIO_SECRET_KEY: 1337R1337R
      MINIO_BUCKET: uploads
      MINIO_USE_SSL: false
      JWT_SECRET: your_jwt_secret_here
      PORT: 9000
      NODE_ENV: production
      # Добавляем переменные для правильного подключения к MinIO
      MINIO_HOST: minio
      MINIO_SERVICE_PORT: 9000
      # SMTP настройки
      EMAIL_HOST: smtp.mail.yahoo.com
      EMAIL_PORT: 587
      EMAIL_USER: l_o_v_e.u@yahoo.com
      EMAIL_PASS: "mcki kook jfar cdjx"
    ports:
      - "9000:9000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - ./backend/LAB.key:/app/LAB.key:ro
      - ./backend/LAB.crt:/app/LAB.crt:ro
    networks:
      - app-network
    restart: unless-stopped

  # Frontend React приложение
  frontend:
    build: ./frontend
    container_name: company_courses_frontend
    environment:
      REACT_APP_API_URL: https://localhost:9000
      REACT_APP_MINIO_URL: http://localhost:9075
    ports:
      - "3000:80"
      - "3001:443"
    depends_on:
      backend:
        condition: service_started
    networks:
      - app-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local

networks:
  app-network:
    driver: bridge 