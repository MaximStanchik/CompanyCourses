version: '3.8'

services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "9000:9000"
    environment:
      - NODE_ENV=development
      - PORT=9000
      - DATABASE_URL=postgresql://postgres:password@172.17.0.2:5432/company_courses
      - SECRET=dev_secret_key_change_in_production
      - FRONTEND_URL=http://localhost:3000
      - BASE_URL=http://localhost:9000
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./backend/static/uploads:/app/static/uploads
    network_mode: host
    restart: unless-stopped
    command: npm run dev

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
    network_mode: host
    restart: unless-stopped

 